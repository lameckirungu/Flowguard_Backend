[project]
name = "flowgard"
version = "0.1.0"
description = "Predictive maintenance platform for fluid-transport pipeline infrastructure (pumps/pipelines). Multi-tenant, with KPC (Kenya Pipeline Company) as the anchor tenant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# FIX: Increased line length to 150 characters to accommodate long Open-Meteo URLs and SQL math
line-length = 150
target-version = "py311"
# Autogenerated Alembic revisions aren't hand-edited/reviewed like the rest
# of the codebase — don't lint them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: flake8-bugbear flags function calls in default arguments, but
# `Depends(...)` / `Query(...)` in a default is the required FastAPI
# idiom, not a bug — ignore it project-wide instead of littering `noqa`.
# FIX: Added E701 (multiple statements on one line) and F401 (unused imports in __init__)
ignore = ["B008", "E701", "F401"]