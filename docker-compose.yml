# Local/dev stack: Postgres + a one-shot migration runner + the API.
# `db` uses TCP + password auth (see .env.example's note on TCP vs Unix
# socket) since containers don't share the host's peer-auth setup.
#
#   docker compose up --build              # db + migrate + api
#   docker compose --profile seed run --rm seed   # seed KPC after migrate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowgard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowgard}
      POSTGRES_DB: ${POSTGRES_DB:-flowgard}
    volumes:
      - flowgard_pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5434 -> container 5432: avoids clashing with host Postgres services.
      # `api`/`migrate` talk to `db` on the internal compose network (db:5432).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowgard} -d ${POSTGRES_DB:-flowgard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowgard}:${POSTGRES_PASSWORD:-flowgard}@db:5432/${POSTGRES_DB:-flowgard}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowgard}:${POSTGRES_PASSWORD:-flowgard}@db:5432/${POSTGRES_DB:-flowgard}_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8501
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

  seed:
    build: .
    command: ["sh", "-c", "python scripts/seed_platform_admin.py && python scripts/seed_kpc_tenant.py"]
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
    profiles: [seed]

volumes:
  flowgard_pgdata: